<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Boosty goal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap">
<style>
  :root {
    --cream: #fff6e5;
    --gold:  #ffc94a;
    --ink:   #1a110c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { font-family: Oswald, Impact, "Arial Narrow", sans-serif; width: 560px; padding: 14px 20px 24px 14px; }

  .box { display: flex; align-items: center; gap: 24px; }

  .count {
    font-size: 116px; font-weight: 700; line-height: 1; white-space: nowrap; color: var(--cream);
    text-shadow:
      -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 0px -2px 0 var(--ink), -2px 0px 0 var(--ink), 0px 2px 0 var(--ink), 2px 0px 0 var(--ink),
      1px 1px 0 var(--ink), 2px 2px 0 var(--ink), 3px 3px 0 var(--ink), 4px 4px 0 var(--ink), 5px 5px 0 var(--ink), 6px 6px 0 var(--ink),
      0 0 26px rgba(26,17,12,.55), 0 8px 40px rgba(26,17,12,.45);
  }

  .side { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }

  .tag {
    display: inline-block; padding: 6px 18px 8px;
    background: var(--gold); color: var(--ink); border-radius: 6px;
    font-size: 27px; font-weight: 600; line-height: 1.2; letter-spacing: .02em; white-space: nowrap;
    box-shadow: 4px 4px 0 var(--ink);
    transform: rotate(-2deg); transform-origin: left center;
  }

  .bar { display: flex; gap: 8px; width: 100%; }
  .seg {
    flex: 1; height: 26px; border-radius: 5px;
    border: 2px solid var(--gold);
    background: rgba(255,246,229,.22);
    box-shadow: 3px 3px 0 var(--ink);
    transition: background .6s;
  }
  .seg.on { background: var(--gold); }

  .bump { animation: bump .6s ease; }
  @keyframes bump { 40% { transform: scale(1.1); } }
  @media (prefers-reduced-motion: reduce) { .bump { animation: none; } }
</style>
</head>
<body>
  <div class="box">
    <div class="count" id="count">–/–</div>
    <div class="side">
      <div class="tag" id="title">Подписчики на Boosty</div>
      <div class="bar" id="bar"></div>
    </div>
  </div>

<script>
  // адрес воркера (или передайте ?api=... в ссылке)
  const params = new URLSearchParams(location.search);
  const API = params.get("api") || "https://boosty-goal.1tropican1.workers.dev/";
  const REFRESH_MS = 60000;
  if (params.get("title")) document.getElementById("title").textContent = params.get("title");

  const countEl = document.getElementById("count");
  const barEl = document.getElementById("bar");
  let last = null;

  function render({ current, target }) {
    countEl.textContent = current + "/" + target;
    if (last !== null && current > last) {
      countEl.classList.remove("bump"); void countEl.offsetWidth; countEl.classList.add("bump");
    }
    last = current;
    // сегменты по одному на подписчика; если цель большая, показываем сплошную шкалу
    const n = target <= 12 ? target : 1;
    barEl.innerHTML = "";
    for (let i = 0; i < n; i++) {
      const s = document.createElement("div");
      s.className = "seg";
      if (target <= 12) {
        if (i < current) s.classList.add("on");
      } else {
        s.style.background = `linear-gradient(90deg, var(--gold) ${Math.min(100, current / target * 100)}%, rgba(255,246,229,.22) 0)`;
      }
      barEl.appendChild(s);
    }
  }

  async function tick() {
    try {
      const r = await fetch(API, { cache: "no-store" });
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      render(d);
    } catch (e) { console.warn("goal fetch failed:", e); }
  }
  tick();
  setInterval(tick, REFRESH_MS);
</script>
</body>
</html>
